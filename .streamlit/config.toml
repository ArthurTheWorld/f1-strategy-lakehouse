[client]
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#f7b83d"
linkColor = "#f7b83d"
backgroundColor = "#0d1013"
secondaryBackgroundColor = "#06080b"
textColor = "#eceff2"
borderColor = "#2d3135"
showWidgetBorder = true
baseRadius = "6px"
paddingTop = "2rem"
paddingBottom = "3rem"
font = "Host Grotesk:https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500&display=swap"
headingFont = "Host Grotesk:https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500&display=swap"
codeFont = "Atkinson Hyperlegible Mono:https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500&display=swap"
headingFontSizes = ["1.5rem", "2.4rem", "1.08rem"]
headingFontWeights = [500, 500, 500]
metricValueFontSize = "1.5rem"
metricValueFontWeight = 400
dataframeHeaderBackgroundColor = "#15191c"
